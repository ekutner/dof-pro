name: Android CI

on:
  push:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 21, not 17: it is what the project is built with locally (the JDK bundled with
      # Android Studio), so CI and the desk agree about the toolchain.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Before anything is built, and the build stops here if they fail: an artefact that
      # compiles but gets the optics wrong is worse than no artefact.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dof-pro-test-report
          path: app/build/reports/tests/testDebugUnitTest

      # Written only when the secret is actually set. An empty secret would otherwise
      # leave a zero byte keystore.jks, which *exists* as far as the build is concerned
      # and fails later with an obscure "invalid keystore format" instead of simply
      # building unsigned.
      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 --decode > "${{ github.workspace }}/keystore.jks"
            echo "Keystore decoded; the release build will be signed."
          else
            echo "::warning::No KEYSTORE_BASE64 secret set - the release build will be unsigned."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # The bundle is what Play takes; the APK is for sideloading onto a device to check
      # the release build behaves like the debug one.
      - name: Build release APK and bundle
        env:
          SIGNING_KEY_STORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dof-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Globbed: the file is app-release.apk when signed and app-release-unsigned.apk
      # when not, and a missing path is an upload failure rather than a warning.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dof-pro-release-apk
          path: app/build/outputs/apk/release/app-release*.apk

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: dof-pro-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Cleanup keystore
        if: always()
        run: rm -f "${{ github.workspace }}/keystore.jks"
